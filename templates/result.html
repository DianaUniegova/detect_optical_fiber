<!DOCTYPE html>
<html>
<head>
    <title>Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">
    <h1>Fiber Detector</h1>
    <nav>
        <a href="/home">Home</a>
        <a href="/logout">Logout</a>
    </nav>
</header>

<main class="main-content">

    <div class="result-card">

        <h2>Detection Result</h2>

        {% if result.detected %}
            <p class="status success">✔ Fiber lines detected</p>
        {% else %}
            <p class="status error">✖ No lines detected</p>
        {% endif %}

        <div class="image-container">
            <img 
                src="{{ url_for('result_file', filename=result.result_image.split('/')[-1]) }}"
                class="result-image"
            >
        </div>

        <a 
            href="{{ url_for('result_file', filename=result.result_image.split('/')[-1]) }}"
            download
            class="download-btn"
        >
            Download result
        </a>

        <a href="/home" class="back-btn">← Back</a>

    </div>

</main>

<footer class="footer">
    <p>© 2026 Fiber Detection System</p>
</footer>

</body>
</html>
